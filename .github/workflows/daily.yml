name: Daily read and drumbeat

on:
  schedule:
    # 07:00 UTC on weekdays
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Provisional signal and drumbeat
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python daily.py

      - name: Commit refreshed data
        run: |
          git config user.name  "soylee22"
          git config user.email "leeslater1992@gmail.com"
          git add data.js data/daily_signal.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "drumbeat refresh: $(date +%Y-%m-%d)"
            git push
          fi
