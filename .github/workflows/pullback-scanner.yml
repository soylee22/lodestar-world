name: Simple Pullback 1W Scanner

on:
  schedule:
    # 12:30 UTC, 16:45 UTC (after London close), and 21:30 UTC (after US / Friday weekly close) on weekdays
    - cron: '30 12 * * 1-5'
    - cron: '45 16 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run 54-ticker Weekly Simple Pullback scan
        run: python pullback_scanner.py

      - name: Commit refreshed pullback scanner page and JSON
        run: |
          git config user.name  "soylee22"
          git config user.email "leeslater1992@gmail.com"
          git add pullback.html data/pullback_scan.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated Simple Pullback 1W scan refresh: $(date +%Y-%m-%d)"
            git push
          fi
